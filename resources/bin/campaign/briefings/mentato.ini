# Mentat Ordos text information

# Format:
# [SCEN]
#
# Number=<scenario number>  
#
# The scenario number links the briefing to the SCEN<house>0<number>.ini file. 
# Number 1 , House Ordos, means : SCEN O 001.INI , changing the number will
# make the ini loader think the briefing belongs to that specific scen number
# therefor do not change them!
# 
# [BRIEFING]
# [WIN]
# [LOSE]
# [ADVICE]
# 
# Each section holds : Text="string"
# Max string length (assuming monospaced font) as shown below. Additional characters carry on off the edge of the screen.
# Text="                                                                                 "
# Maximum of 10 text strings allowed
# !!!! REMEMBER !!!!
# Mentats show the text in pairs of 2. (each time 2 "text=" are used)
# Use spaces to give the user more time to read if nescesary.
#
# Note: In dune 2 , missions have the same briefings, ie, mission 2 region a b c have the same briefings
#       However, i do want you to specify them all since later on we can change these missions.

# =============================================================
# HOUSE DESCRIPTION (Presented by the Bene Gesserit)
# =============================================================
[DESCRIPTION]
Text="Дом Ордос"
Text=""
Text="Родная планета Дома Ордос — холодный мир, скованный льдом."
Text=""
Text="Предположительно, Ордос ввозят продовольствие и технологии из соседних звёздных систем."
Text=""
Text="Будучи торговцами и посредниками, Ордос ничего не производят"
Text="сами: прибыль им приносит искусство коммерции."

# =============================================================
# MISSION 1 (no region to be selected)
# =============================================================
[SCEN]
# What scenario is it?
Number=1

[BRIEFING]
Text="Добро пожаловать. Я ваш ментат — можете называть меня Аммоном."
Text=""
Text="Чтобы представлять ценность для Картеля, вы должны приносить нам кредиты."
Text=""
Text="В качестве испытания мы направляем вас в регион, где вы должны выполнить производственную квоту в 1000 кредитов."
Text=""
Text="Постройте переработчик и добывайте пряность в этом районе."
Text=""
Text="Я очень занят, но, если возникнут вопросы, можете обратиться ко мне."
Text=""

[WIN]
Text="Вы подаёте надежды."
Text=""
Text="Продолжайте проявлять управленческий талант — и, возможно,"
Text="мы найдём вам постоянное место в нашей организации."

[LOSE]
Text="Не понимаю, как вы могли провалить столь лёгкое задание."
Text=""
Text="О вас отзывались весьма высоко, поэтому мы готовы забыть этот эпизод — при условии успеха в следующем задании."
Text=""

[ADVICE]
Text="Сначала уложите бетонную площадку 4×4."
Text=""
Text="Затем установите на ней ветроловушку."
Text=""
Text="После этого постройте переработчик и выполните квоту в 1000 кредитов."
Text=""

