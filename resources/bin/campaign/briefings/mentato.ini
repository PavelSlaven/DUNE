# Mentat Ordos text information

# Format:
# [SCEN]
#
# Number=<scenario number>  
#
# The scenario number links the briefing to the SCEN<house>0<number>.ini file. 
# Number 1 , House Ordos, means : SCEN O 001.INI , changing the number will
# make the ini loader think the briefing belongs to that specific scen number
# therefor do not change them!
# 
# [BRIEFING]
# [WIN]
# [LOSE]
# [ADVICE]
# 
# Each section holds : Text="string"
# Max string length (assuming monospaced font) as shown below. Additional characters carry on off the edge of the screen.
# Text="                                                                                 "
# Maximum of 10 text strings allowed
# !!!! REMEMBER !!!!
# Mentats show the text in pairs of 2. (each time 2 "text=" are used)
# Use spaces to give the user more time to read if nescesary.
#
# Note: In dune 2 , missions have the same briefings, ie, mission 2 region a b c have the same briefings
#       However, i do want you to specify them all since later on we can change these missions.

# =============================================================
# HOUSE DESCRIPTION (Presented by the Bene Gesserit)
# =============================================================
[DESCRIPTION]
Text="Дом Ордос"
Text=""
Text="Родная планета Дома Ордос — холодный мир, скованный льдом."
Text=""
Text="Предполагается, что Ордос ввозят продовольствие и технологии из соседних звёздных систем."
Text=""
Text="Ордос не производит материальных товаров, предпочитая торговлю"
Text="и посредничество, на которых Дом и наживает своё состояние."

# =============================================================
# MISSION 1 (no region to be selected)
# =============================================================
[SCEN]
# What scenario is it?
Number=1

[BRIEFING]
Text="Добро пожаловать. Я ваш ментат — можете называть меня Аммоном."
Text=""
Text="Чтобы иметь какую-либо ценность для Картеля, вы должны предоставить нам кредиты."
Text=""
Text="В качестве проверки мы назначим вас в регион и попросим выполнить производственную квоту в 1000 кредитов."
Text=""
Text="Постройте перерабатывающий завод и добывайте пряность в этом районе."
Text=""
Text="Я очень занят, но при необходимости вы можете обратиться ко мне."
Text=""

[WIN]
Text="Вы подаёте надежды."
Text=""
Text="Если вы продолжите демонстрировать хорошие управленческие навыки,"
Text="мы можем найти для вас постоянную должность в нашей организации."

[LOSE]
Text="Не понимаю, как вы могли провалить столь лёгкое задание."
Text=""
Text="Поскольку вас рекомендовали, мы простим этот провал, если вы успешно выполните следующее задание."
Text=""

[ADVICE]
Text="Сначала уложите четыре бетонные плиты квадратом 2×2."
Text=""
Text="Затем постройте ветряную ловушку на бетонных плитах."
Text=""
Text="Также постройте перерабатывающий завод и выполните квоту в 1000 кредитов."
Text=""

