# Mission 2  Region A
[SCEN]
Number=2

[BRIEFING]
Text="Теперь ваша квота — 2700 кредитов. Главная задача — добыть необходимое количество пряности."
Text=""
Text="Мы не требуем уничтожить силы Харконнен, однако, присвоив их"
Text="хранилища, вы сможете значительно сэкономить время."

[WIN]
Text="Поздравляю. Картель начинает обращать на вас внимание."
Text=""
Text="Если вы продолжите в том же духе, у вас определённо есть будущее в Картеле."
Text=""

[LOSE]
Text="Похоже, я ошибся в ваших способностях. Отвоевать этот регион обойдётся нам дорого."
Text=""
Text="Лишь полный успех в следующем задании способен спасти вашу карьеру."
Text=""

[ADVICE]
Text="После ветроловушки постройте казармы и начните готовить пехоту."
Text="Так вы надёжнее защитите добычу пряности."

