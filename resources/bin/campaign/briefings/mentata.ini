# Mission 2  Region A
[SCEN]
Number=2

[BRIEFING]
Text="Приветствую. Рад вновь вас видеть."
Text=""
Text="Верховное командование требует добыть в новом районе пряности на 2700 кредитов."
Text=""
Text="К сожалению, мы подтвердили наличие базы Дома Ордос в этом регионе."
Text=""
Text="Удачи!"
Text=""

[WIN]
Text="Превосходно!"
Text=""
Text="Нашему стремлению вести честную борьбу противостоят и Ордос, и Харконнен."
Text=""
Text="Собранная вами пряность существенно поможет нашему делу."
Text=""

[LOSE]
Text="Потеря этого региона в пользу Ордос нанесёт Дому Атрейдес тяжёлый удар."
Text=""
Text="В следующий раз постарайтесь лучше. Важность этой миссии невозможно переоценить."
Text=""

[ADVICE]
Text="После ветроловушки постройте казармы, чтобы обучать пехоту."
Text=""
Text="Так вы надёжнее защитите добычу пряности."
Text=""


