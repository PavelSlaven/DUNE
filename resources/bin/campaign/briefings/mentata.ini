# Mentat Atreides text information

# Format:
# [SCEN]
#
# Number=<scenario number>  
#
# The scenario number links the briefing to the SCEN<house>0<number>.ini file. 
# Number 1 , House Atreides, means : SCEN A 001.INI , changing the number will
# make the ini loader think the briefing belongs to that specific scen number
# therefor do not change them!
# 
# [BRIEFING]
# [WIN]
# [LOSE]
# [ADVICE]
# 
# Each section holds : Text="string"
# Max string length (assuming monospaced font) as shown below. Additional characters carry on off the edge of the screen.
# Text="                                                                                 "
# Maximum of 10 text strings allowed
# !!!! REMEMBER !!!!
# Mentats show the text in pairs of 2. (each time 2 "text=" are used)
# Use spaces to give the user more time to read if necessary.
#
# Note: In dune 2 , missions have the same briefings, ie, mission 2 region a b c have the same briefings
#       However, i do want you to specify them all since later on we can change these missions.

# =============================================================
# HOUSE DESCRIPTION (Presented by the Bene Gesserit)
# =============================================================
[DESCRIPTION]
Text="Дом Атрейдес"
Text=""
Text="Каладан, родная планета Атрейдесов, отличается тёплым мягким климатом и зелёными плодородными землями."
Text=""
Text="Богатые почвы и мягкий климат позволяют заниматься самыми разными видами земледелия."
Text=""
Text="В последние столетия развитие промышленности и технологий ещё более приумножило благосостояние жителей Каладана."
Text=""


# =============================================================
# MISSION 1 (no region to be selected)
# =============================================================
[SCEN]
# What scenario is it?
Number=1

[BRIEFING]
Text="Приветствую, я ваш ментат Кирилл."
Text=""
Text="Вместе мы очистим эту планету от скверны других Домов."
Text=""
Text="Верховное командование поручает вам накопить 1000 кредитов."
Text=""
Text="Чтобы получать кредиты, постройте переработчик и добывайте пряность."
Text=""

[WIN]
Text="Поздравляю!"
Text=""
Text="Я знал, что вы без труда достигнете цели."
Text=""
Text="Буду рад помогать вам и в следующих миссиях."
Text=""

[LOSE]
Text="Это весьма прискорбно."
Text=""
Text="Мы возлагали на вас большие надежды."
Text=""
Text="Мы настаиваем, чтобы вы попытались снова."
Text=""
Text="Мы не зря в вас поверили и ждём успешного завершения вашего первого испытания."
Text=""

[ADVICE]
Text="Сначала уложите бетонную площадку 2×2."
Text=""
Text="Затем установите на ней ветроловушку."
Text=""
Text="После этого постройте переработчик и выполните квоту в 1000 кредитов."
Text=""

