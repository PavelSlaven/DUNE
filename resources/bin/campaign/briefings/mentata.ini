# Mission 2  Region A
[SCEN]
Number=2

[BRIEFING]
Text="Приветствую, для меня большая честь видеть вас снова."
Text=""
Text="Верховное командование требует добыть пряности на 2700 кредитов в новом районе."
Text=""
Text="К сожалению, мы подтвердили наличие базы Дома Ордос в этом регионе."
Text=""
Text="Удачи!"
Text=""

[WIN]
Text="Отличная работа!"
Text=""
Text="Нашим усилиям по обеспечению честной игры на этой планете противостоят как Ордос, так и Харконнен."
Text=""
Text="Собранная вами пряность очень поможет нашим усилиям."
Text=""

[LOSE]
Text="Потеря этого региона в пользу Ордос нанесёт Дому Атрейдес тяжёлый удар."
Text=""
Text="В следующий раз постарайтесь лучше. Важность этой миссии невозможно переоценить."
Text=""

[ADVICE]
Text="Если у вас есть ветряная ловушка, постройте казарму, чтобы производить солдат."
Text=""
Text="Это поможет надёжнее защитить добычу пряности."
Text=""


