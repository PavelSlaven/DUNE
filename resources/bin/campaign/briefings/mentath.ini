[BRIEFING]
Text="Презренный Дом Ордос закрепился в регионе и добывает пряность, по праву принадлежащую Харконненам."
Text=""
Text="Уничтожьте объекты Дома Ордос в этой области и установите контроль от имени Дома Харконнен."
Text=""

[WIN]
Text="Поздравляю. Вы добиваетесь прогресса."
Text=""
Text="Некоторые мои коллеги сомневались в ваших способностях. Рад, что вы доказали их неправоту."
Text=""
Text="Давайте теперь посмотрим, не оправдалась ли моя уверенность в вас."
Text=""

[LOSE]
Text="Я знал это!"
Text=""
Text="Некоторые из моих соратников выразили уверенность в ваших способностях,"
Text="но я знал, что вы слишком слабы для командования войсками Харконненов!"
Text="Охрана!"
Text=""
Text="Устраните эту вонь, пока она не заразила всю планету!"
Text=""

