[SCEN]
Number=5

[BRIEFING]
Text="Презренный Дом Ордос закрепился в регионе и добывает пряность, по праву принадлежащую Харконненам."
Text=""
Text="Уничтожьте сооружения Ордос в этом районе и установите власть Дома Харконнен."
Text=""

[WIN]
Text="Поздравляю. Вы заметно продвинулись."
Text=""
Text="Некоторые мои коллеги сомневались в ваших способностях. Рад, что вы доказали их неправоту."
Text=""
Text="Теперь посмотрим, не напрасно ли я в вас поверил."
Text=""

[LOSE]
Text="Я так и знал!"
Text=""
Text="Некоторые мои соратники верили в ваши способности, но я знал:"
Text="вы слишком слабы, чтобы командовать войсками Харконнен!"
Text="Стража!"
Text=""
Text="Уберите эту вонь, пока она не отравила всю планету!"
Text=""

