Text="Мы заслужили хорошую репутацию на этой планете."
Text=""
Text="Не вздумайте опозорить меня!"
Text=""

[WIN]
Text="Лавры победителя вам к лицу, сын мой!"
Text=""
Text="Возможно, я даже посоветую другим претендентам изучить вашу тактику."
Text=""
Text="Я бы извинился за недооценку сил Ордос в прошлой кампании, но теперь это уже неважно, верно?"
Text=""

[LOSE]
Text="Это, должно быть, дурная шутка?"
