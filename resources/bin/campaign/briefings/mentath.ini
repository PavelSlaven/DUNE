# Mentat Harkonnen text information                                                                           "

# Format:
# [SCEN]
#
# Number=<scenario number>  
#
# The scenario number links the briefing to the SCEN<house>0<number>.ini file. 
# Number 1 , House Harkonnen, means : SCEN H 001.INI , changing the number will
# make the ini loader think the briefing belongs to that specific scen number
# therefor do not change them!
# 
# [BRIEFING]
# [WIN]
# [LOSE]
# [ADVICE]
# 
# Each section holds : Text="string"
# Max string length (assuming monospaced font) as shown below. Additional characters carry on off the edge of the screen.
# Text="                                                                                 "
# Maximum of 10 text strings allowed
# !!!! REMEMBER !!!!
# Mentats show the text in pairs of 2. (each time 2 "text=" are used)
# Use spaces to give the user more time to read if nescesary.
#
# Note: In dune 2 , missions have the same briefings, ie, mission 2 region a b c have the same briefings
#       However, i do want you to specify them all since later on we can change these missions.

# =============================================================
# HOUSE DESCRIPTION (Presented by the Bene Gesserit)
# =============================================================
[DESCRIPTION]
Text="Дом Харконнен"
Text=""
Text="С мрачной Гьеди Прайм свирепый Дом Харконнен распространил своё влияние по всей Вселенной."
Text=""
Text="Харконнены — жестокий народ, безжалостный и к друзьям, и к врагам в своём фанатичном стремлении к власти."
Text=""

# =============================================================
# MISSION 1 (no region to be selected)
# =============================================================
[SCEN]
# What scenario is it?
Number=1

[BRIEFING]
Text="Я — ментат Раднор."
Text=""
Text="Под моим руководством вы, возможно, окажетесь полезны в завоевании этой пыльной планетки."
Text=""
Text="Первое испытание — добыть 1000 кредитов. Ни гранулой меньше."
Text=""
Text="Добывайте пряность и постройте переработчик, чтобы превращать её в кредиты."
Text=""
Text="Если кто-то из глупцов решится напасть на вашу базу, вы с"
Text="удовольствием увидите в деле непобедимые войска Харконнен."

[WIN]
Text="Вы меня порадовали."
Text=""
Text="Служите мне и впредь — и я позабочусь о награде."
Text=""

[LOSE]
Text="Вы недостойны даже моего презрения."
Text=""
Text="Знаете, что бывает с теми, кто подвёл Дом Харконнен?"
Text=""

[ADVICE]
Text="Сначала уложите бетонную площадку 2×2."
Text=""
Text="Затем установите на ней ветроловушку."
Text=""
Text="После этого постройте переработчик и выполните квоту в 1000 кредитов."
Text=""

# =============================================================
# MISSION 2 (3 regions)
# =============================================================

# Mission 2  Region A
[SCEN]
Number=2

[BRIEFING]
Text="Дом Харконнен щедро даровал вам новую возможность служить нам."
Text=""
Text="Теперь мы позволим вам командовать в более опасном районе и накопить 2700 кредитов."
Text=""
Text="Никчёмных Атрейдесов, которых вы встретите, следует уничтожать из принципа."
Text="Но главная цель — выполнить квоту по пряности."

[WIN]
Text="И снова вы меня порадовали."
Text=""
Text="Вы напоминаете мне себя в молодости."
Text=""
Text="Возможно, в ваших жилах и вправду течёт кровь Харконненов!"
Text=""

[LOSE]
Text="Не верится, что вы не сумели выполнить квоту."
Text=""
Text="Это простое задание должно было показать ваши командирские способности."
Text="Не испытывайте моё терпение."

[ADVICE]
Text="После ветроловушки постройте военную академию, чтобы готовить ракетчиков."
Text=""
Text="Так вы надёжнее защитите добычу пряности."
Text=""

