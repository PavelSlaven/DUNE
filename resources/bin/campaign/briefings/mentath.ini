# Mentat Harkonnen text information                                                                           "

# Format:
# [SCEN]
#
# Number=<scenario number>  
#
# The scenario number links the briefing to the SCEN<house>0<number>.ini file. 
# Number 1 , House Harkonnen, means : SCEN H 001.INI , changing the number will
# make the ini loader think the briefing belongs to that specific scen number
# therefor do not change them!
# 
# [BRIEFING]
# [WIN]
# [LOSE]
# [ADVICE]
# 
# Each section holds : Text="string"
# Max string length (assuming monospaced font) as shown below. Additional characters carry on off the edge of the screen.
# Text="                                                                                 "
# Maximum of 10 text strings allowed
# !!!! REMEMBER !!!!
# Mentats show the text in pairs of 2. (each time 2 "text=" are used)
# Use spaces to give the user more time to read if nescesary.
#
# Note: In dune 2 , missions have the same briefings, ie, mission 2 region a b c have the same briefings
#       However, i do want you to specify them all since later on we can change these missions.

# =============================================================
# HOUSE DESCRIPTION (Presented by the Bene Gesserit)
# =============================================================
[DESCRIPTION]
Text="Дом Харконнен"
Text=""
Text="Из тёмного мира Гьеди-Прайм жестокий Дом Харконнен распространил своё влияние по Вселенной."
Text=""
Text="Харконнены жестоки и безжалостны к друзьям и врагам в своём фанатичном стремлении к власти."
Text=""

# =============================================================
# MISSION 1 (no region to be selected)
# =============================================================
[SCEN]
# What scenario is it?
Number=1

[BRIEFING]
Text="Я — ментат Раднор."
Text=""
Text="Под моим руководством вы, возможно, сможете помочь нам завоевать эту пыльную маленькую планету."
Text=""
Text="В первом испытании вы должны накопить не менее 1000 кредитов."
Text=""
Text="Добывайте пряность и постройте перерабатывающий завод, чтобы получать кредиты."
Text=""
Text="Если кто-либо из наших глупых врагов попытается атаковать вашу базу, вы"
Text="получите удовольствие увидеть непобедимые войска Харконненов в действии."

[WIN]
Text="Вы меня порадовали."
Text=""
Text="Продолжайте хорошо служить мне, и я позабочусь о том, чтобы вы были вознаграждены."
Text=""

[LOSE]
Text="Вы недостойны даже моего презрения."
Text=""
Text="Знаете, что бывает с теми, кто подвёл Дом Харконнен?"
Text=""

[ADVICE]
Text="Сначала постройте группу бетонных плит два на два."
Text=""
Text="Затем постройте ветряную ловушку на бетонных плитах."
Text=""
Text="Также постройте перерабатывающий завод и выполните квоту в 1000 кредитов."
Text=""

# =============================================================
# MISSION 2 (3 regions)
# =============================================================

# Mission 2  Region A
[SCEN]
Number=2

[BRIEFING]
Text="Дом Харконнен щедро предоставил вам новую возможность служить нам."
Text=""
Text="Теперь мы позволим вам взять на себя командование в более опасной зоне и накопить 2700 кредитов."
Text=""
Text="Хотя бесполезных Атрейдесов, с которыми вы можете столкнуться в этом регионе,"
Text="в принципе всегда следует уничтожать, вашей целью является квота пряности."

[WIN]
Text="И снова вы меня порадовали."
Text=""
Text="Вы напоминаете мне себя в молодости."
Text=""
Text="Возможно, в ваших жилах и вправду течёт кровь Харконненов!"
Text=""

[LOSE]
Text="Я не могу поверить, что вы не смогли накопить свою квоту."
Text=""
Text="Это была простая задача, которая должна была позволить нам проверить ваши"
Text="лидерские способности. Предлагаю вам не испытывать мое терпение дальше."

[ADVICE]
Text="Постройте казармы ВОР, чтобы обучать гранатомётчиков."
Text=""
Text="Это поможет надёжнее защитить добычу пряности."
Text=""

