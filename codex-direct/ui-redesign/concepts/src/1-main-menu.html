<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>1 — главное меню</title>
<link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>
:root { --mx: 44px; --logo-w: 300px; --logo-y: 44px; --menu-y: 132px; --menu-w: 264px; --bh: 40px; --gap: 8px; --fs: 16px; }
.art { background-image: url("../../../../.cache/ui-redesign/assets/hd4/main_menu_background.png"); background-position: 58% 50%; }
.scrim { background: linear-gradient(90deg, rgba(8,11,13,.88) 0%, rgba(8,11,13,.62) 30%, rgba(8,11,13,0) 62%), linear-gradient(0deg, rgba(8,11,13,.7), rgba(8,11,13,0) 22%); }
.logo { left: var(--mx); top: var(--logo-y); width: var(--logo-w); filter: drop-shadow(0 4px 10px rgba(0,0,0,.7)); }
.tag { left: var(--mx); top: 104px; font-size: 13px; color: var(--brass); }
.menu { left: var(--mx); top: var(--menu-y); width: var(--menu-w); gap: var(--gap); }
.menu .btn { height: var(--bh); font-size: var(--fs); justify-content: flex-start; padding-left: 22px; }
.menu .btn.hover::before { content: ""; position: absolute; left: -16px; top: 50%; width: 9px; height: 9px; margin-top: -5px; transform: rotate(45deg); background: linear-gradient(135deg, var(--brass-hi), var(--brass-mid)); box-shadow: 0 0 0 1px var(--edge), 0 0 8px rgba(255,202,83,.45); }
.menu .gapline { height: 4px; }
.foot { left: var(--mx); right: var(--mx); bottom: 14px; font-size: 13px; color: var(--text2); justify-content: space-between; }
</style></head>
<body>
<div class="art"></div><div class="scrim"></div>
<img class="abs logo" src="../../../../.cache/ui-redesign/assets/hd4/main_menu_logo.png">
<div class="abs tag t-ui">The Maker</div>
<div class="abs col menu">
  <div class="btn">Кампания</div>
  <div class="btn hover">Схватка</div>
  <div class="btn disabled">Сохранения</div>
  <div class="gapline"></div>
  <div class="btn">Редактор карт</div>
  <div class="btn">Настройки</div>
  <div class="btn">Авторы</div>
  <div class="gapline"></div>
  <div class="btn">Выход</div>
</div>
<div class="abs row foot"><span>Сборка 2026-11-11 · v0.9.0-ru-hd</span></div>
</body></html>
