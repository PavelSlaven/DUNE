<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>3b — карта кампании</title>
<link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>
/* Map keeps the 608:240 aspect of the campaign art; the window grows with the canvas. */
:root { --m: 12px; --hd: 44px; --mapw: 752px; --ft: 86px; --fs: 15px; --crest: 34px; --tfs: 19px; }
.art { background-image: url("../../../../.cache/ui-redesign/assets/hd4/main_menu_background.png"); background-position: 58% 50%; filter: blur(3px); transform: scale(1.03); }
.scrim { background: rgba(4,6,8,.82); }
.win { left: calc(50% - (var(--mapw) + 24px) / 2); top: 50%; transform: translateY(-50%); width: calc(var(--mapw) + 24px); display: flex; flex-direction: column; }
.hd { height: var(--hd); font-size: var(--tfs); gap: 12px; }
.hd img { width: var(--crest); height: var(--crest); filter: drop-shadow(0 2px 3px #000); }
.hd .step { margin-left: auto; display: flex; align-items: center; gap: 5px; font: calc(var(--fs) - 2px)/1 "Russo"; color: var(--text2); }
.hd .step i { width: calc(var(--fs) * .55); height: calc(var(--fs) * .55); transform: rotate(45deg); background: #2a3138; box-shadow: 0 0 0 1px #030405; display: block; }
.hd .step i.d { background: linear-gradient(135deg, var(--brass-hi), var(--brass-mid)); } .hd .step i.c { background: var(--gold); box-shadow: 0 0 0 1px #030405, 0 0 8px var(--gold); }
.map { margin: 12px 12px 0; height: calc(var(--mapw) * 240 / 608); position: relative; }
.map .img { position: absolute; inset: 3px; background: url("../../../../.cache/ui-redesign/derived/campaign-map-tinted.jpg") center / 100% 100%; }
.map .hl { position: absolute; left: 39.5%; top: 37%; width: 13%; height: 27%; border-radius: 46% 54% 50% 50%; background: radial-gradient(ellipse, rgba(255,230,150,.34), rgba(255,230,150,0) 70%); }
.map .tip { left: 47%; top: 30%; }
.map .tip small { display: block; font: calc(var(--fs) - 2px)/1.3 "PTN"; color: var(--text2); }
.foot { height: var(--ft); padding: 0 14px; gap: 14px; }
.msg { flex: 1; align-self: stretch; margin: 10px 0; padding: 0 16px; display: flex; align-items: center; gap: 12px; font: calc(var(--fs) + 2px)/1.25 "PTN"; color: var(--text); }
.msg .ico { width: calc(var(--fs) + 6px); height: calc(var(--fs) + 6px); color: var(--brass); }
.leg { gap: 4px; font: calc(var(--fs) - 1px)/1 "PTN"; color: var(--text2); }
.leg div { display: flex; align-items: center; gap: 7px; } .leg i { width: calc(var(--fs) * .6); height: calc(var(--fs) * .6); box-shadow: 0 0 0 1px #030405; display: block; } .leg b { font: calc(var(--fs) - 2px)/1 "Russo"; color: var(--text); font-weight: normal; margin-left: auto; padding-left: 10px; }
.foot .btn { height: calc(var(--fs) * 2.4); font-size: var(--fs); }
</style></head>
<body>
<div class="art"></div><div class="scrim"></div>
<div class="abs panel win">
  <div class="hd"><img src="../../../../.cache/ui-redesign/assets/hd4/hud_house_atreides.png">Выберите следующий регион
    <div class="step"><span>Миссия 5 из 9</span>&nbsp;<i class="d"></i><i class="d"></i><i class="d"></i><i class="d"></i><i class="c"></i><i></i><i></i><i></i><i></i></div></div>
  <div class="wellf map" data-c="6" data-noise="0"><div class="img"></div><div class="hl"></div>
    <div class="tip"><b>Регион 12</b><small>владеет Харконнен · нажмите, чтобы напасть</small></div></div>
  <div class="row foot">
    <div class="wellf msg" data-c="4" data-noise="0"><i data-i="info"></i>…на земли Ордосов. Выберите регион для следующего удара.</div>
    <div class="col leg">
      <div><i style="background:var(--atreides)"></i>Атрейдес<b>11</b></div>
      <div><i style="background:var(--harkonnen)"></i>Харконнен<b>7</b></div>
      <div><i style="background:var(--ordos)"></i>Ордос<b>9</b></div>
    </div>
    <div class="btn"><i data-i="map"></i>Выбор миссии</div>
  </div>
</div>
</body></html>
