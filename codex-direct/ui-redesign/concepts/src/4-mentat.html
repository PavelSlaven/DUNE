<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>4 — брифинг ментата</title>
<link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>
/* The mentat painting is a 640×480 frame; --k scales it to the canvas height (art is 2560×1920, so it stays sharp up to k = 4). */
:root { --k: 1.25; }
body { background: var(--g0); }
.sidefill { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, var(--g1) 0%, var(--g0) 70%); }
.stage { left: calc(50% - 320px * var(--k)); top: calc(50% - 240px * var(--k)); width: calc(640px * var(--k)); height: calc(480px * var(--k));
  background: url("../../../../.cache/ui-redesign/assets/sdl_mentat_hd4/0037_MENTATA.png") center / 100% 100% no-repeat; box-shadow: 0 0 0 1px var(--edge), 0 0 0 2px var(--brass-lo), 0 0 60px rgba(0,0,0,.9); }
.a { position: absolute; left: calc(var(--x) * 1px * var(--k)); top: calc(var(--y) * 1px * var(--k)); width: calc(var(--w) * 1px * var(--k)); height: calc(var(--h) * 1px * var(--k)); }
.txt { font: calc(15.2px * var(--k))/1.22 "PTN"; color: var(--text); text-shadow: 0 calc(1px * var(--k)) 0 var(--edge), 0 0 calc(4px * var(--k)) var(--edge); display: flex; flex-direction: column; justify-content: center; }
.txt .caret { height: calc(13px * var(--k)); width: calc(1.5px * var(--k)); vertical-align: -10%; }
.scene { background: url("../../../../.cache/ui-redesign/assets/hd4/main_menu_background.png") 55% 42% / 330% auto no-repeat; box-shadow: inset 0 0 calc(18px * var(--k)) rgba(0,0,0,.85); }
.stage .btn.a { padding: 0; font-size: calc(12px * var(--k)); }
.ms { left: calc(8px * var(--k)); bottom: calc(8px * var(--k)); height: calc(22.4px * var(--k)); padding: 0 calc(8px * var(--k)); font-size: calc(10.4px * var(--k)); gap: calc(4px * var(--k)); }
.ms .ico { width: calc(11.2px * var(--k)); height: calc(11.2px * var(--k)); }
</style></head>
<body>
<div class="sidefill"></div>
<div class="abs stage">
  <div class="a txt" style="--x:30;--y:19;--w:578;--h:41"><div>Приветствую вас. Я — ваш ментат, и моя первая задача — помочь</div><div>вам добыть 1000 кредитов пряности на этой планете.<span class="caret"></span></div></div>
  <div class="a scene" style="--x:273;--y:108;--w:328;--h:222"></div>
  <div class="a btn" style="--x:346;--y:393;--w:119;--h:43">Повторить</div>
  <div class="a btn primary hover" style="--x:483;--y:393;--w:119;--h:43">Начать</div>
  <div class="abs btn ms"><i data-i="map"></i>Выбор миссии</div>
</div>
</body></html>
