<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>9b — окно сохранения и загрузки</title>
<link rel="stylesheet" href="ui.css"><script src="ui.js"></script>
<style>
/* Window from step P8 rebuilt from the common parts: header, input, list rows, buttons. */
:root { --ww: 560px; --wh: 452px; }
.art { background-image: url("../../../../.cache/ui-redesign/derived/field-atreides-747x568.jpg"); filter: blur(2px) saturate(.7); transform: scale(1.02); }
.scrim { background: rgba(4,6,8,.72); }
.win { left: calc(50% - var(--ww) / 2); top: calc(50% - var(--wh) / 2); width: var(--ww); height: var(--wh); display: flex; flex-direction: column; }
.body { flex: 1; min-height: 0; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.namerow { gap: 10px; } .namerow .lbl { font: 16px/1 "PTN"; color: var(--text2); flex: none; }
.list { flex: 1; min-height: 0; display: flex; }
.list .rows { flex: 1; }
.lrow { height: 27px; } .lrow .no { width: 22px; color: var(--text3); font: 13px/1 "Russo"; }
.lrow .dt { margin-left: auto; font: 13px/1 "PTN"; color: var(--text3); }
.lrow.selected .no, .lrow.selected .dt { color: var(--brass-hi); }
.lrow.bad { color: var(--bad-text); }
.foot { height: 56px; padding: 0 16px; gap: 8px; border-top: 1px solid #06080a; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); flex: none; margin-top: 10px; }
.foot .btn { min-width: 112px; padding: 0 12px; }
.foot .msg { font: 15px/1.2 "PTN"; color: var(--ok); gap: 6px; white-space: nowrap; } .foot .msg .ico { width: 15px; height: 15px; }
</style></head>
<body>
<div class="art"></div><div class="scrim"></div>
<div class="abs panel win">
  <div class="hd center">Сохранения</div>
  <div class="body">
    <div class="row namerow"><span class="lbl">Название</span><div class="input focus grow">Перед штурмом<span class="caret"></span></div></div>
    <div class="list"><div class="well rows">
      <div class="lrow"><span class="no">01</span>Быстрое сохранение</div>
      <div class="lrow hover"><span class="no">02</span>Миссия 5, начало</div>
      <div class="lrow selected"><span class="no">03</span>Перед штурмом</div>
      <div class="lrow"><span class="no">04</span>Схватка: Sietch Stefan</div>
      <div class="lrow bad"><span class="no">05</span>&lt;повреждено&gt;</div>
      <div class="lrow disabled"><span class="no">06</span>&lt;пусто&gt;</div>
      <div class="lrow disabled"><span class="no">07</span>&lt;пусто&gt;</div>
      <div class="lrow disabled"><span class="no">08</span>&lt;пусто&gt;</div>
      <div class="lrow disabled"><span class="no">09</span>&lt;пусто&gt;</div>
      <div class="lrow disabled"><span class="no">10</span>&lt;пусто&gt;</div>
    </div></div>
  </div>
  <div class="row foot">
    <div class="btn primary"><i data-i="save"></i>Сохранить</div>
    <div class="btn"><i data-i="load"></i>Загрузить</div>
    <div class="row msg grow"><i data-i="check"></i>Слот 3 сохранён.</div>
    <div class="btn">Закрыть</div>
  </div>
</div>
</body></html>
